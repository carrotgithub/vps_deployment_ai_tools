# 示例：catch-all default_server，未知 Host/SNI 时直接断开（444）。
# 源自 vps-manager `scripts/base/tools/nginx_default_server_444.conf`，去掉固定业务域名路径。
#
# 使用前：
#   1. 将下列 ssl_certificate* 替换为你机上已有的一组合法 PEM（可为任意已签发站点，
#      未知 SNI 时客户端仍会收到证书不匹配，属预期）。
#   2. 复制到 conf.d 并重载 nginx：
#        cp nginx_default_server_444.example.conf /usr/local/nginx/conf/conf.d/00-default-444.conf
#        /usr/local/nginx/sbin/nginx -t && systemctl reload nginx
#
# Nginx 1.28+：HTTP/2 使用独立指令 `http2 on`，勿写 `listen ... http2`。
#
# 若已用 tools/nginx_sni_split.sh enable 把 443 交给 SNI 分流，本文件不能再直接
# listen 443，否则和 stream 抢端口，nginx 起不来。把下面的
# `listen 443 ssl default_server;` 换成
# `include /usr/local/nginx/conf/snippets/https_listen_default.conf;`，
# 或者复制进 conf.d 后重跑一次 enable，由分流工具迁移。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /usr/local/nginx/conf/ssl/REPLACE_ME/fullchain.pem;
    ssl_certificate_key /usr/local/nginx/conf/ssl/REPLACE_ME/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
